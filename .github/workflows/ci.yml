name: CI Test Suite and Evaluation Runner

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quickdrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and start PaySwift sandbox
        run: |
          docker build -t qd-payswift ./payswift
          docker run -d --name qd-payswift -p 8081:8081 qd-payswift
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8081/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs qd-payswift
          exit 1

      - name: Run Alembic migrations
        env:
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/quickdrop
        run: |
          alembic upgrade head

      - name: Run Full Pytest Test Suite
        env:
          PAYSWIFT_BASE_URL: http://127.0.0.1:8081
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/quickdrop
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/quickdrop
        run: |
          pytest -v

      - name: Start FastAPI Background Service for Evaluation
        env:
          PAYSWIFT_BASE_URL: http://127.0.0.1:8081
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/quickdrop
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/quickdrop
        run: |
          python -m app.database.init
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Run Evaluation Runner Against Service and PaySwift
        run: |
          python evals/run.py http://localhost:8000 --payswift-url http://127.0.0.1:8081
